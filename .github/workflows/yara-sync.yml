name: YARA Rule Sync

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch community YARA rules
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/Yara-Rules/rules/master/malware/MALW_Eicar.yar" \
            -o /tmp/community_eicar.yar

          # Append only if not already present — idempotent across runs.
          if ! grep -qF "Yara-Rules/MALW_Eicar" src-tauri/src/shield/bundled_rules.yar; then
            printf '\n// synced from Yara-Rules/MALW_Eicar\n' >> src-tauri/src/shield/bundled_rules.yar
            cat /tmp/community_eicar.yar >> src-tauri/src/shield/bundled_rules.yar
          fi

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/shield/bundled_rules.yar
          git diff --staged --quiet || git commit -m "chore: sync YARA community rules"
          git push
