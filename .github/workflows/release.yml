name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest       # Apple Silicon
            target: aarch64-apple-darwin
          - os: macos-13           # Intel Mac (last Intel runner on GitHub)
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install YARA (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install yara

      - name: Install YARA (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get install -y libyara-dev

      - name: Install YARA (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          vcpkg install yara:x64-windows-static
          echo "VCPKG_ROOT=C:/vcpkg" >> $env:GITHUB_ENV
          echo "YARA_LIBRARY_PATH=C:/vcpkg/installed/x64-windows-static/lib" >> $env:GITHUB_ENV

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - name: Install frontend deps
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          # yara-sys bindgen needs the YARA headers on macOS
          YARA_LIBRARY_PATH: ${{ startsWith(matrix.os, 'macos') && '/opt/homebrew/lib' || '' }}
          BINDGEN_EXTRA_CLANG_ARGS: ${{ startsWith(matrix.os, 'macos') && '-I/opt/homebrew/include' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ReLay ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for details.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
